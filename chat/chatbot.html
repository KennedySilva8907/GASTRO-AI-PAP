<!DOCTYPE html>
<html lang="pt">
<head>
    <link rel="icon" type="image/svg+xml" href="frigideira.svg">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GastroAI Chatbot - Assistente de inteligência artificial especializado em gastronomia.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <title>GastroAI Chatbot</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>(function(){if(!sessionStorage.getItem('gastro-transition-meta'))return;var d=document.documentElement;d.classList.add('page-entering');d.style.background='radial-gradient(circle at 24% 18%,rgba(255,152,0,.24),transparent 34rem),radial-gradient(circle at 78% 8%,rgba(255,208,138,.14),transparent 24rem),linear-gradient(135deg,#0b0907 0%,#130d08 56%,#080706 100%)';})();</script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.3/dist/umd/supabase.min.js"
      integrity="sha384-iWpUQPQzWsFiosLgsS8o+e6E8y3Gm+EW2m/vAAo7A2H3fuc4KOKEx+5CAord2H2z"
      crossorigin="anonymous" defer></script>
</head>
<body>
    <div id="food-container" aria-hidden="true"></div>

    <button id="back-button" class="back-button" aria-label="Voltar">
        <div class="back-button-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                <path fill="none" d="M0 0h24v24H0z"/>
                <path d="M19 13H5.83l5.59 5.59L10 20l-8-8 8-8 1.41 1.41L5.83 11H19v2z"/>
            </svg>
        </div>
        <span class="back-button-text">Voltar</span>
    </button>

    <main id="chat-container">
        <aside class="chat-sidebar" id="chat-sidebar">
            <div class="chat-sidebar-head">
                <button
                    class="sidebar-toggle"
                    id="sidebar-toggle"
                    type="button"
                    aria-expanded="true"
                    aria-controls="conversation-list"
                    title="Minimizar conversas"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <span class="sidebar-label"><span class="sidebar-kicker">Conversas</span></span>
                <button
                    class="new-chat-button"
                    id="new-chat-button"
                    type="button"
                    title="Nova conversa"
                    aria-label="Nova conversa"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>
            <div class="conversation-list" id="conversation-list"></div>
            <div class="sidebar-foot" id="sidebar-foot">
                <span class="sidebar-foot-text" tabindex="0"></span>
            </div>
        </aside>

        <div class="scrim" id="sidebar-scrim" hidden></div>

        <div class="chat-main">
        <div id="chat-header">
            <button
                class="drawer-button"
                id="drawer-button"
                type="button"
                title="As minhas conversas"
                aria-label="As minhas conversas"
            >
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <div class="chat-header-main">
                <span class="chat-kicker">GastroAI Atelier</span>
                <h1>Chef AI</h1>
            </div>
            <div class="chat-header-side">
                <span class="chat-status">Assistente online</span>
            </div>
        </div>

        <div class="chat-prompt-strip" aria-hidden="true">
            <span class="prompt-chip">Receitas</span>
            <span class="prompt-chip">Menus</span>
            <span class="prompt-chip">Técnicas</span>
            <span class="prompt-chip">Harmonização</span>
        </div>

        <div id="chat-messages"></div>

        <div class="chat-form-panel">
            <form id="chat-form">
                <div class="chat-form-main">
                    <label class="chat-input-shell" for="user-input">
                        <span class="chat-input-kicker">Nova pergunta</span>
                        <input
                            type="text"
                            id="user-input"
                            placeholder="Peça receitas, técnicas, menus ou harmonização..."
                            autocomplete="off"
                        >
                    </label>

                    <button
                        id="submit-button"
                        class="submit-button"
                        type="submit"
                        title="Enviar mensagem"
                        aria-label="Enviar mensagem"
                    >
                        <span class="button-icon" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                                <polyline points="12 5 19 12 12 19"></polyline>
                            </svg>
                        </span>
                        <span class="button-label">Enviar</span>
                    </button>
                </div>

                <div class="chat-controls" role="toolbar" aria-label="Ações da conversa">
                    <button
                        type="button"
                        id="export-button"
                        class="control-button export-button"
                        disabled
                        title="Descarregar a conversa em PDF"
                        aria-label="Descarregar a conversa em PDF"
                    >
                        <span class="button-icon" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                        </span>
                        <span class="control-label">PDF</span>
                    </button>

                    <button
                        id="new-conversation-button"
                        class="control-button new-conversation-button"
                        type="button"
                        title="Começar uma conversa nova"
                        aria-label="Começar uma conversa nova"
                    >
                        <span class="button-icon" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </span>
                        <span class="control-label">Nova</span>
                    </button>

                    <button
                        id="stop-button"
                        class="control-button stop-button"
                        type="button"
                        disabled
                        title="Parar mensagem"
                        aria-label="Parar mensagem"
                    >
                        <span class="button-icon" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="7" y="7" width="10" height="10" rx="2"></rect>
                            </svg>
                        </span>
                        <span class="control-label">Parar</span>
                    </button>
                </div>
            </form>
        </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.18.0/matter.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.3.3/dist/purify.min.js"
      integrity="sha384-pcBjnGbkyKeOXaoFkmJiuR9E08/6gkmus6/Strimnxtl3uk0Hx23v345pWyC/MMr"
      crossorigin="anonymous" defer></script>
    <script type="module" src="script.js"></script>
</body>
</html>
